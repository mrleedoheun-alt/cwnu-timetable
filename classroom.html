<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강의실 현황 · 여기(YEOGI)</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="leaflet.css" />
  <script src="leaflet.js"></script>
  <style>
    /* ── 미니 달력 ── */
    .cal-card {
      background:var(--card); border-radius:var(--radius);
      box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden;
      display:inline-flex; flex-direction:column;
      width:100%;
    }
    .cal-inner {
      display:flex; align-items:flex-start; gap:20px;
      padding:12px 16px 12px; flex-wrap:wrap;
    }
    .cal-mini-wrap { flex-shrink:0; }
    .cal-header-row {
      display:flex; align-items:center; justify-content:space-between;
      gap:6px; margin-bottom:6px;
    }
    .cal-nav-btn {
      background:none; border:1.5px solid var(--line); border-radius:6px;
      width:22px; height:22px; cursor:pointer; font-size:13px;
      display:flex; align-items:center; justify-content:center;
      font-family:inherit; color:var(--muted); transition:all .15s; padding:0;
    }
    .cal-nav-btn:hover { border-color:#2563eb; color:#2563eb; }
    .cal-month-label { font-size:12px; font-weight:700; min-width:88px; text-align:center; color:var(--text); }
    .cal-grid {
      display:grid; grid-template-columns:repeat(7,1fr);
      gap:2px; width:196px;
    }
    .cal-dayname { font-size:9px; font-weight:700; color:var(--muted); text-align:center; padding:2px 0 3px; }
    .cal-dayname.sat { color:#93c5fd; }
    .cal-dayname.sun { color:#fca5a5; }
    .cal-day {
      width:26px; height:26px; border-radius:6px;
      display:flex; align-items:center; justify-content:center;
      font-size:11px; cursor:pointer; font-weight:500;
      transition:all .12s; border:1.5px solid transparent; font-family:inherit;
      background:none;
    }
    .cal-day:hover:not(.weekend):not(.empty) { background:#eff6ff; border-color:#93c5fd; }
    .cal-day.today    { background:#eff6ff; border-color:#2563eb; color:#2563eb; font-weight:800; }
    .cal-day.selected { background:#1a3a7a !important; border-color:#1a3a7a !important; color:#fff !important; font-weight:800; }
    .cal-day.sat:not(.empty) { color:#93c5fd; }
    .cal-day.sun:not(.empty) { color:#fca5a5; }
    .cal-day.weekend { cursor:default; }
    .cal-day.empty   { cursor:default; }

    /* ── 시간 선택 (교시 + 슬라이더) ── */
    .time-picker-wrap {
      flex:1; min-width:220px;
      border-left:1.5px solid var(--line); padding-left:16px;
      display:flex; flex-direction:column; gap:10px; justify-content:center;
    }
    .time-picker-label { font-size:11px; font-weight:700; color:var(--muted); }

    /* 교시 버튼 */
    .period-row { display:flex; gap:4px; }
    .period-btn {
      flex:1; padding:5px 0; border-radius:7px; font-size:10px; font-weight:700;
      border:1.5px solid var(--line); background:var(--card); color:var(--muted);
      cursor:pointer; font-family:inherit; transition:all .12s;
      display:flex; flex-direction:column; align-items:center; gap:1px;
      line-height:1.2;
    }
    .period-btn:hover { border-color:#2563eb; color:#2563eb; background:#eff6ff; }
    .period-btn.active { background:#1a3a7a; border-color:#1a3a7a; color:#fff; }
    .period-btn .p-num { font-size:12px; font-weight:800; }
    .period-btn .p-time { font-size:8px; opacity:.75; }

    /* 슬라이더 */
    .slider-wrap { display:flex; flex-direction:column; gap:4px; }
    .slider-labels { display:flex; justify-content:space-between; font-size:9px; color:var(--muted); font-weight:600; }
    .time-slider {
      -webkit-appearance:none; appearance:none;
      width:100%; height:4px; border-radius:4px;
      background:var(--line); outline:none; cursor:pointer;
      accent-color:#2563eb;
    }
    .time-slider::-webkit-slider-thumb {
      -webkit-appearance:none; appearance:none;
      width:16px; height:16px; border-radius:50%;
      background:#2563eb; cursor:pointer;
      box-shadow:0 0 0 3px rgba(37,99,235,.2);
      transition:box-shadow .15s;
    }
    .time-slider::-webkit-slider-thumb:hover { box-shadow:0 0 0 5px rgba(37,99,235,.2); }
    .slider-current-time {
      text-align:center; font-size:15px; font-weight:800;
      color:#1a3a7a; letter-spacing:.5px;
    }

    /* ── 선택 뱃지 ── */
    .selected-date-badge {
      display:inline-flex; align-items:center; gap:6px;
      background:#eff6ff; border:1.5px solid #93c5fd; border-radius:20px;
      padding:4px 14px; font-size:13px; font-weight:600; color:#1d4ed8;
      margin-bottom:14px;
    }
    .selected-date-badge.weekend { background:#f1f5f9; border-color:#cbd5e1; color:#64748b; }

    /* ── 캠퍼스 지도 ── */
    .map-card {
      background:var(--card); border-radius:var(--radius);
      box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden;
    }
    .map-card-head {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 20px 10px;
    }
    .map-card-head h2 { font-size:15px; font-weight:700; }
    #campusMap { height:440px; }


    /* ── Leaflet 커스텀 마커 ── */
    .campus-marker {
      border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-size:10px; font-weight:800; color:#fff; cursor:pointer;
      box-shadow:0 2px 8px rgba(0,0,0,.35); border:2.5px solid rgba(255,255,255,.9);
      transition:transform .15s, box-shadow .15s;
      width:36px; height:36px;
    }
    .campus-marker:hover { transform:scale(1.15); box-shadow:0 4px 14px rgba(0,0,0,.4); }
    .campus-marker.no-classroom { filter:saturate(.75); cursor:default; }

    .campus-marker.selected {
      border:3px solid #fff; box-shadow:0 0 0 3px #1a3a7a, 0 4px 14px rgba(0,0,0,.4);
      transform:scale(1.2);
    }
    .campus-marker-label {
      background:rgba(255,255,255,.95); border-radius:6px; padding:2px 6px;
      font-size:10px; font-weight:700; color:#1a1a1a; white-space:nowrap;
      box-shadow:0 1px 4px rgba(0,0,0,.2); pointer-events:none;
    }

    /* ── 지도 범례 ── */
    .map-legend-bar {
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      padding:6px 14px 8px; border-top:1px solid var(--line); font-size:11px;
    }
    .legend-circle { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:3px; }

    /* ── Accordion ── */
    .bld-accordion { border-bottom:1px solid var(--line); }
    .bld-accordion:last-child { border-bottom:none; }
    .bld-accordion-head {
      display:flex; align-items:center; gap:8px;
      padding:9px 14px; cursor:pointer; transition:background .12s;
      user-select:none;
    }
    .bld-accordion-head:hover { background:#f8fafc; }
    .bld-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .bld-acc-name { font-size:13px; font-weight:700; flex:1; }
    .bld-acc-stat { font-size:12px; color:var(--muted); white-space:nowrap; }
    .bld-acc-chevron { font-size:10px; color:var(--muted); transition:transform .2s; flex-shrink:0; }
    .bld-acc-chevron.open { transform:rotate(90deg); }
    .bld-accordion-body { background:#fafafa; }

    /* 강의실 행 (compact) */
    .room-row-compact {
      display:flex; align-items:center; gap:10px;
      padding:7px 16px 7px 32px;
      border-top:1px solid var(--line); font-size:12px;
      transition:background .1s;
    }
    .room-row-compact:hover { background:#eff6ff; }
    .room-row-num { font-weight:700; font-size:13px; min-width:64px; color:var(--text); }
    .room-row-status { flex:1; display:flex; align-items:center; gap:5px; color:var(--muted); }
    .room-row-status.free { color:#15803d; }
    .room-row-status.busy { color:#dc2626; }
    .room-row-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .room-row-next { margin-left:auto; font-size:11px; color:var(--muted); white-space:nowrap; }

    /* ── 지도 + 강의실 2분할 레이아웃 ── */
    .map-rooms-split {
      display:flex; gap:14px; align-items:stretch; margin-bottom:20px;
    }

    /* 왼쪽: 지도 */
    .map-panel {
      flex:0 0 50%; min-width:0;
      background:var(--card); border-radius:var(--radius);
      box-shadow:var(--shadow); overflow:hidden;
      display:flex; flex-direction:column;
    }
    .map-panel-head {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 14px 8px; flex-shrink:0;
    }
    .map-panel-head h2 { font-size:13px; font-weight:700; }
    #campusMap { flex:1; min-height:0; height:420px; }

    /* 오른쪽: 강의실 패널 */
    .rooms-panel {
      flex:1; min-width:0;
      display:flex; flex-direction:column; gap:10px;
    }
    .rooms-panel-top {
      background:var(--card); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:10px 14px;
      display:flex; flex-direction:column; gap:8px; flex-shrink:0;
    }
    .rooms-scroll {
      flex:1; overflow-y:auto; height:390px;
      padding-right:2px;
    }
    .rooms-scroll::-webkit-scrollbar { width:4px; }
    .rooms-scroll::-webkit-scrollbar-track { background:transparent; }
    .rooms-scroll::-webkit-scrollbar-thumb { background:#e2e8f0; border-radius:4px; }
    /* 강의실 카드 1열 */
    .rooms-scroll .room-grid {
      grid-template-columns:1fr !important;
    }
    /* 강의실 카드 콤팩트 */
    .rooms-scroll .room-card { padding:11px 14px; }
    .rooms-scroll .room-name { font-size:14px; }
    .rooms-scroll .room-course-name { font-size:13px; }
    .rooms-scroll .room-professor, .rooms-scroll .room-time { font-size:11px; }
    .rooms-scroll .room-next { font-size:11px; }
    .rooms-scroll .room-empty-label { font-size:12px; }

    /* 건물 선택 바 — 패널 안으로 이동 */
    .bld-bar-mini {
      display:none; align-items:center; gap:8px; flex-wrap:wrap;
      background:#eff6ff; border:1.5px solid #93c5fd; border-radius:10px;
      padding:7px 12px; font-size:12px;
    }
    .bld-bar-mini .bld-name { font-weight:700; color:#1a3a7a; font-size:13px; }
    .bld-bar-mini .bld-stat { color:#2563eb; }
    .bld-bar-mini .bld-reset-btn {
      margin-left:auto; padding:3px 10px; border-radius:8px;
      border:1.5px solid #93c5fd; background:var(--card); font-size:11px;
      font-weight:600; color:#2563eb; cursor:pointer; font-family:inherit;
    }
    .bld-bar-mini .bld-reset-btn:hover { background:#2563eb; color:#fff; }

    /* ── 강의실 상세 일정 모달 ── */
    .room-detail-backdrop {
      position:fixed; inset:0; z-index:2000; background:rgba(15,23,42,.42);
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .room-detail-modal {
      width:min(760px, 96vw); max-height:88vh; overflow:hidden;
      background:var(--card); border-radius:16px; box-shadow:0 20px 60px rgba(15,23,42,.25);
      display:flex; flex-direction:column;
    }
    .room-detail-head {
      padding:16px 18px 12px; border-bottom:1px solid var(--line);
      display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    }
    .room-detail-title { font-size:20px; font-weight:900; color:var(--text); }
    .room-detail-sub { font-size:12px; color:var(--muted); margin-top:3px; }
    .room-detail-close { border:0; background:transparent; font-size:18px; cursor:pointer; color:var(--muted); padding:4px; }
    .room-detail-body { padding:14px 18px 18px; overflow:auto; }
    .room-detail-grid { display:grid; grid-template-columns:1fr 260px; gap:14px; align-items:start; }
    .room-week-table { width:100%; border-collapse:collapse; font-size:12px; overflow:hidden; border-radius:10px; }
    .room-week-table th { background:#f8fafc; color:var(--muted); font-size:11px; padding:8px; text-align:left; border-bottom:1px solid var(--line); }
    .room-week-table td { padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
    .room-week-table tr.current-slot td { background:#eff6ff; }
    .room-week-day { width:42px; font-weight:800; color:#1a3a7a; }
    .room-week-time { width:96px; font-weight:700; color:var(--text); white-space:nowrap; }
    .room-week-course { font-weight:700; color:var(--text); }
    .room-week-prof { font-size:11px; color:var(--muted); margin-top:2px; }
    .room-detail-map { height:210px; border-radius:12px; overflow:hidden; background:#e8eef8; }
    .room-detail-info { padding:10px 12px; border:1px solid var(--line); border-radius:12px; margin-top:10px; font-size:12px; color:var(--muted); }
    .room-clickable { cursor:pointer; }
    .room-clickable:hover { outline:2px solid rgba(37,99,235,.18); }
    @media (max-width: 760px) { .room-detail-grid { grid-template-columns:1fr; } .room-detail-map { height:190px; } }
  </style>
</head>
<body data-page="classroom">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand yeogi-brand">
          <span class="brand-ko">여기</span>
          <span class="brand-en">YEOGI</span>
        </div>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" type="button">✕</button>
      </div>
      <nav class="side-nav">
        <a class="side-link" href="index.html"><span class="nav-icon">🏠</span>홈</a>
        <a class="side-link" href="generate.html"><span class="nav-icon">📅</span>시간표 생성</a>
        <a class="side-link active" href="classroom.html"><span class="nav-icon">🏫</span>강의실 현황</a>
        <a class="side-link" href="library.html"><span class="nav-icon">📚</span>도서관 자리</a>
        <a class="side-link" href="settings.html"><span class="nav-icon">⚙️</span>설정</a>
      </nav>
      <div class="side-logout">
        <button class="logout-btn" type="button">로그아웃</button>
      </div>
    </aside>

    <main class="content">
      <header class="page-header">
        <div class="page-header-title">
          <button class="hamburger-btn" id="hamburgerBtn" type="button">☰</button>
          <div>
            <h1>강의실 현황</h1>
            <p class="subtext">지도에서 건물을 클릭하거나 검색으로 강의실을 확인하세요</p>
          </div>
        </div>
        <div class="header-actions">
          <div class="live-clock"><span class="live-dot"></span><span id="clockDisplay">--:--</span></div>
        </div>
      </header>

      <!-- 미니 달력 카드 -->
      <div class="cal-card">
        <div class="cal-inner">
          <!-- 달력 -->
          <div class="cal-mini-wrap">
            <div class="cal-header-row">
              <button class="cal-nav-btn" id="calPrev" type="button">‹</button>
              <span class="cal-month-label" id="calMonthLabel"></span>
              <button class="cal-nav-btn" id="calNext" type="button">›</button>
            </div>
            <div class="cal-grid" id="calGrid">
              <div class="cal-dayname">월</div><div class="cal-dayname">화</div>
              <div class="cal-dayname">수</div><div class="cal-dayname">목</div>
              <div class="cal-dayname">금</div>
              <div class="cal-dayname sat">토</div><div class="cal-dayname sun">일</div>
            </div>
          </div>
          <!-- 시간 선택 -->
          <div class="time-picker-wrap">
            <span class="time-picker-label">⏰ 교시 · 시간 선택</span>
            <!-- 교시 버튼 -->
            <div class="period-row" id="periodRow"></div>
            <!-- 슬라이더 -->
            <div class="slider-wrap">
              <div class="slider-current-time" id="sliderTimeLabel">09:00</div>
              <input type="range" class="time-slider" id="timeSlider"
                     min="480" max="1080" step="30" value="540" />
              <div class="slider-labels">
                <span>08:00</span><span>10:00</span><span>12:00</span>
                <span>14:00</span><span>16:00</span><span>18:00</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 선택 뱃지 -->
      <div id="selectedDateBadge" class="selected-date-badge">📅 오늘 · 현재 시간</div>

      <!-- 통계 -->
      <div class="classroom-stats-row">
        <div class="cls-stat"><span class="cls-stat-num" id="totalRooms">-</span><span class="cls-stat-label">전체 강의실</span></div>
        <div class="cls-stat"><span class="cls-stat-num" id="inUseRooms" style="color:#dc2626">-</span><span class="cls-stat-label">수업 중</span></div>
        <div class="cls-stat"><span class="cls-stat-num" id="freeRooms" style="color:#16a34a">-</span><span class="cls-stat-label">비어있음</span></div>
      </div>

      <!-- 지도 + 강의실 2분할 -->
      <div class="map-rooms-split">

        <!-- 왼쪽: 캠퍼스 지도 -->
        <div class="map-panel">
          <div class="map-panel-head">
            <h2>🗺 창원대학교 캠퍼스</h2>
            <div style="display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)">
              <span><span class="legend-circle" style="background:#16a34a"></span>여유</span>
              <span><span class="legend-circle" style="background:#f59e0b"></span>혼잡</span>
              <span><span class="legend-circle" style="background:#dc2626"></span>만석</span><span><span class="legend-circle" style="background:#94a3b8"></span>강의정보 없음</span>
            </div>
          </div>
          <div id="campusMap"></div>
          <div class="map-legend-bar" style="font-size:10px;padding:5px 12px 7px">
            <span>공식 캠퍼스맵 건물만 표시 · 색상 마커 클릭 → 해당 건물 강의실 표시</span>
          </div>
        </div>

        <!-- 오른쪽: 강의실 패널 -->
        <div class="rooms-panel">
          <!-- 건물 선택 바 + 검색 -->
          <div class="rooms-panel-top">
            <!-- 건물 선택 표시 -->
            <div class="bld-bar-mini" id="buildingSelectedBar">
              <span class="bld-name" id="bldSelName"></span>
              <span class="bld-stat" id="bldSelStat"></span>
              <button class="bld-reset-btn" id="bldResetBtn" type="button">× 전체</button>
            </div>
            <!-- 검색 -->
            <div class="classroom-search" style="margin:0">
              <input type="text" id="roomSearch" placeholder="강의실·과목명·교수명 검색…" />
            </div>
          </div>
          <!-- 강의실 카드 (스크롤) -->
          <div class="rooms-scroll" id="roomsContainer">
            <div class="loading-state"><div class="spinner"></div><span>불러오는 중…</span></div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
  console.log('[YEOGI] classroom.html version 2026-06-03-kakao-dynamic-loader');
  window.addEventListener('error', e=>{
    console.error('[YEOGI] classroom uncaught error', e.error || e.message);
    setTimeout(()=>{
      const el=document.getElementById('roomsContainer');
      if(el && el.querySelector('.spinner')) el.innerHTML=`<div class="loading-state" style="color:#dc2626">⚠ 화면 처리 중 오류가 발생했습니다.<br><small>${e.message}</small></div>`;
    },0);
  });
  window.addEventListener('unhandledrejection', e=>{
    console.error('[YEOGI] classroom unhandled rejection', e.reason);
    const msg=e.reason?.message || String(e.reason || '알 수 없는 오류');
    const el=document.getElementById('roomsContainer');
    if(el && el.querySelector('.spinner')) el.innerHTML=`<div class="loading-state" style="color:#dc2626">⚠ 데이터 처리 중 오류가 발생했습니다.<br><small>${msg}</small></div>`;
  });

  /* ══════════════════════════════════════════════
     강의실 현황 — 캠퍼스 지도 + 달력
  ══════════════════════════════════════════════ */

  const PERIOD_MAP = {
    '0A':['08:00','08:30'],'0B':['08:30','09:00'],
    '1A':['09:00','09:30'],'1B':['09:30','10:00'],
    '2A':['10:00','10:30'],'2B':['10:30','11:00'],
    '3A':['11:00','11:30'],'3B':['11:30','12:00'],
    '4A':['12:00','12:30'],'4B':['12:30','13:00'],
    '5A':['13:00','13:30'],'5B':['13:30','14:00'],
    '6A':['14:00','14:30'],'6B':['14:30','15:00'],
    '7A':['15:00','15:30'],'7B':['15:30','16:00'],
    '8A':['16:00','16:30'],'8B':['16:30','17:00'],

  /* ── 건물 유틸 ── */
  function parseRaw(raw){
    if(!raw) return[];
    const results=[],lastRoom={};
    for(const seg of raw.split(',').map(s=>s.trim()).filter(Boolean)){
      const m=seg.match(/^([월화수목금])(\d{1,2}[AB]|[A-F])(?:\(([^)]+)\))?$/);
      if(!m) continue;
      const day=DAY_KO[m[1]],pair=PERIOD_MAP[m[2]];
      if(day===undefined||!pair) continue;
      const room=m[3]||lastRoom[day]||'';
      if(m[3]) lastRoom[day]=m[3];
      if(room) results.push({day,start:pair[0],end:pair[1],room});
    }
    return results;
  }

  function extractBuilding(room){
    if(!room) return'기타';
    room = room.replace(/-\d+$/, ''); // "52305-1" → "52305"
    for(const p of ['T98','N98','BAC2','BAC','B21']){ if(room.startsWith(p)) return p+'관'; }
    for(const p of ['사천캠퍼스','전산','인문홀','공기원','공실관','사림강당','학군단','테니스장','CWNU']){
      if(room.startsWith(p)) return p;
    }
    const nm=room.match(/^(\d+)$/);
    if(nm){ const c=nm[1]; return c.length>3?c.slice(0,-3)+'관':c+'관'; }
    const km=room.match(/^([가-힣]+)\d+$/); // "사천208" → "사천캠퍼스"
    if(km){ const p=km[1]; return p==='사천'?'사천캠퍼스':p; }
    return room.replace(/\d+$/,'')||'기타';
  }

  function buildingSortNumber(bKey){
    const geoKey=String(toGeoKey(bKey)||bKey||'');

    return numeric ? Number(numeric[0]) : 9999;

  function buildingCompare(a,b){
    const na=buildingSortNumber(a);
    const nb=buildingSortNumber(b);
    if(na!==nb) return na-nb;
    return String(a).localeCompare(String(b),'ko',{numeric:true});
  }

  function roomCompare(a,b){
    const byBuilding=buildingCompare(a.building,b.building);
    if(byBuilding) return byBuilding;
    return String(a.room).localeCompare(String(b.room),'ko',{numeric:true});
  }

  function fetchJsonWithTimeout(url, timeoutMs=12000){
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(), timeoutMs);
    return fetch(url,{cache:'no-store',signal:ctrl.signal})
      .then(async r=>{
        const text=await r.text();
        let data=null;
        try{ data=text?JSON.parse(text):null; }
        catch(e){ throw new Error(`${url} JSON 파싱 실패`); }
        return {ok:r.ok,status:r.status,data};
      })
      .finally(()=>clearTimeout(timer));
  }

  function waitForKakaoMapConstructor(resolve,reject){
    const started=Date.now();
    const check=()=>{
      if(window.kakao?.maps?.Map) return resolve('map-ready');
      if(Date.now()-started>6000) return reject(new Error('SDK는 로드됐지만 kakao.maps.Map 준비가 지연됩니다. t1.daumcdn.net 추가 스크립트 차단 여부를 확인하세요.'));
      setTimeout(check,100);
    };
    check();
  }

  function loadKakaoSdk(){
    if(window.kakao?.maps?.Map) return Promise.resolve('already-loaded');
    return new Promise((resolve,reject)=>{
      const previous=document.getElementById('kakaoMapSdk');
      if(previous) previous.remove();
      const script=document.createElement('script');
      script.id='kakaoMapSdk';
      script.type='text/javascript';
      script.src=`/api/kakao-maps-sdk?appkey=${CLASSROOM_KAKAO_APP_KEY}&autoload=false&v=yeogi_20260603_autoload_false`;
      script.onload=()=>{
        console.log('[Kakao] sdk.js onload via same-origin proxy');
        if(!window.kakao?.maps) {
          reject(new Error('sdk.js는 로드됐지만 window.kakao.maps가 없습니다. JavaScript 키/지도 API 활성화/도메인 등록을 확인하세요.'));
          return;
        }
        if(typeof window.kakao.maps.load === 'function') {
          window.kakao.maps.load(()=>{
            if(window.kakao?.maps?.Map && window.kakao?.maps?.LatLng) resolve('loaded-after-kakao-load');
            else reject(new Error('kakao.maps.load 콜백 후에도 Map/LatLng 생성자가 없습니다.'));
          });
          return;
        }
        if(window.kakao.maps.Map && window.kakao.maps.LatLng) {
          resolve('loaded');
          return;
        }
        waitForKakaoMapConstructor(resolve,reject);
      };
      script.onerror=()=>reject(new Error('same-origin SDK 프록시 스크립트 로드 실패'));
      document.head.appendChild(script);
    });
  }

  function makeMapMarker({key, geo, rooms=[]}){
    const freeCount=rooms.filter(r=>r.free).length;
    const total=rooms.length;
    const hasClassrooms=total>0;
    const color=hasClassrooms ? markerColor(freeCount,total) : '#94a3b8';
    const isSelected=key===curBuilding || `${key}관`===curBuilding;
    const label=String(key).length<=4 ? String(key) : String(key).slice(0,4);
    const name=displayBuildingName(key,geo);

    const el=document.createElement('div');
    el.className=`campus-marker${isSelected?' selected':''}${hasClassrooms?'':' no-classroom'}`;
    el.style.background=color;
    el.style.opacity=hasClassrooms?'1':'.72';
    el.innerHTML=`<span style="font-size:9px;font-weight:800;line-height:1">${label}</span>`;
    el.title=hasClassrooms ? `${name} — 빈 강의실 ${freeCount}/${total}` : `${name} — 강의 데이터 없음`;
    if(hasClassrooms) el.addEventListener('click',()=>window.__selectBld(rooms[0].building));

    if(kakaoMap){
      const ov=new kakao.maps.CustomOverlay({
        position:new kakao.maps.LatLng(geo.lat,geo.lng),
        content:el, yAnchor:0.5, xAnchor:0.5, zIndex:isSelected?10:(hasClassrooms?2:1),
      });
      ov.setMap(kakaoMap);
      markerLayers[key]=ov;

      const mk=L.marker([geo.lat,geo.lng],{

        zIndexOffset:isSelected?1000:(hasClassrooms?100:0),

      markerLayers[key]=mk;
    }
  }

  /* ── 마커 업데이트 (Kakao / Leaflet 공통) ── */
  function updateMapMarkers(){
    if(!kakaoMap && !leafletMap) return;

    Object.values(markerLayers).forEach(m=>{
      if(kakaoMap) m.setMap?.(null);
      else m.remove?.();
    });
    markerLayers={};

    const byBuilding=groupByBuilding();
    const roomGroupsByGeo={};
    for(const [bKey,rooms] of Object.entries(byBuilding)){
      const geoKey=toGeoKey(bKey);
      if(!roomGroupsByGeo[geoKey]) roomGroupsByGeo[geoKey]=[];
      roomGroupsByGeo[geoKey].push(...rooms);
    }

    const drawn=new Set();
    for(const key of officialMarkerKeys()){
      const geo=buildingsGeo[key];
      const rooms=roomGroupsByGeo[key] || [];
      makeMapMarker({key,geo,rooms});
      drawn.add(key);
    }

    // 공식 캠퍼스맵에 없는 별칭/추정 건물은 지도에 추가하지 않는다.
  }

    updateMapMarkers(); render(); updateStats();

    if(geo?.lat){
      if(kakaoMap) kakaoMap.panTo(new kakao.maps.LatLng(geo.lat,geo.lng));
      else if(leafletMap) leafletMap.panTo([geo.lat,geo.lng]);
    }
  }

  function resetBuilding(){
    curBuilding='all';
    document.getElementById('buildingSelectedBar').style.display='none';
    updateMapMarkers(); render(); updateStats();
  }

  window.__selectBld = selectBuilding;

  /* ── 강의실 계산 ── */
  function applySelection(){
    updateBadge();
    if(!coursesCache) return;
    const dow=selectedDate.getDay();
    const dayIdx=(dow===0||dow===6)?-1:dow-1;
    const tMin=selectedMin;
    if(dayIdx<0){ allRooms=[]; updateMapMarkers(); buildRoomCards(); return; }
    if(coursesCache[0]?.slots!==undefined) buildFromApi(coursesCache,dayIdx,tMin);
    else buildFromRaw(coursesCache,dayIdx,tMin);
  }

  function buildFromApi(courses,dayIdx,tMin){
    const map={};
    for(const c of courses){
      if(!c.slots) continue;
      for(const s of c.slots){
        if(!s.room) continue;
        if(!map[s.room]) map[s.room]={room:s.room,building:extractBuilding(s.room),slots:[]};
        if(s.day===dayIdx) map[s.room].slots.push({start:s.start,end:s.end,name:c.name,prof:c.professor||''});
      }
    }
    finalize(map,dayIdx,tMin);
  }

  function buildFromRaw(rawList,dayIdx,tMin){
    const map={};
    for(const c of rawList){
      const cname=c.course_name||c.name||'';
      if(!c.schedule_room||!cname||cname==='과목명') continue;
      for(const s of parseRaw(c.schedule_room)){
        if(!s.room) continue;
        if(!map[s.room]) map[s.room]={room:s.room,building:extractBuilding(s.room),slots:[]};
        if(s.day===dayIdx) map[s.room].slots.push({start:s.start,end:s.end,name:cname,prof:c.professor||''});
      }
    }
    finalize(map,dayIdx,tMin);
  }

  function finalize(map,dayIdx,tMin){
    allRooms=Object.values(map).map(r=>{
      const sorted=r.slots.sort((a,b)=>toMin(a.start)-toMin(b.start));
      const cur=sorted.find(s=>toMin(s.start)<=tMin&&tMin<toMin(s.end));
      const next=sorted.find(s=>toMin(s.start)>tMin);
      return{room:r.room,building:r.building,free:!cur,
        curName:cur?.name||null,curProf:cur?.prof||null,curStart:cur?.start||null,curEnd:cur?.end||null,
        nextName:next?.name||null,nextStart:next?.start||null};
    });
    allRooms.sort(roomCompare);
    updateMapMarkers();
    buildRoomCards();
  }

  function buildRoomCards(){
    // 건물 선택이 유효한지 확인
    if(curBuilding!=='all'&&!allRooms.some(r=>r.building===curBuilding)) resetBuilding();
    else if(curBuilding!=='all'){
      const rooms=allRooms.filter(r=>r.building===curBuilding);
      const freeCount=rooms.filter(r=>r.free).length;
      document.getElementById('bldSelStat').textContent=`빈 강의실 ${freeCount}개 / 전체 ${rooms.length}개`;
    }
    render(); updateStats();
  }

  function filtered(){
    let list=curBuilding==='all'?allRooms:allRooms.filter(r=>r.building===curBuilding);
    if(searchQ){
      const q=searchQ.toLowerCase();
      list=list.filter(r=>
        r.room.toLowerCase().includes(q)||
        (r.curName||'').toLowerCase().includes(q)||
        (r.curProf||'').toLowerCase().includes(q)||
        (r.nextName||'').toLowerCase().includes(q)
      );
    }
    return list;
  }

  function render(){
    const list=filtered();
    const el=document.getElementById('roomsContainer');
    if(!list.length){
      const dow=selectedDate.getDay();
      const msg=(dow===0||dow===6)?'주말에는 정규 수업이 없습니다.':'해당하는 강의실이 없습니다.';
      el.innerHTML=`<div class="loading-state">${msg}</div>`;
      return;
    }

    // 건물 선택 or 검색 중 → 카드형
    if(curBuilding!=='all'||searchQ){
      el.innerHTML=`<div style="display:flex;flex-direction:column;gap:8px;padding:4px 0">${list.map(roomCard).join('')}</div>`;
      return;
    }

    // 전체 보기 → 건물별 아코디언
    const byBld={};
    for(const r of list){ if(!byBld[r.building]) byBld[r.building]=[]; byBld[r.building].push(r); }
    const sorted=Object.entries(byBld).sort((a,b)=>buildingCompare(a[0],b[0]));

    el.innerHTML=`<div style="border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)">
      ${sorted.map(([bKey,rooms])=>{
        const free=rooms.filter(r=>r.free).length;
        const total=rooms.length;
        const color=markerColor(free,total);
        const safeKey=bKey.replace(/[^a-zA-Z0-9가-힣]/g,'_');
        return`<div class="bld-accordion">
          <div class="bld-accordion-head" onclick="window.__selectBldBySafe('${safeKey}')" title="지도에서 ${bName(bKey)} 위치 보기">
            <span class="bld-dot" style="background:${color}"></span>
            <span class="bld-acc-name">${bName(bKey)}</span>
            <span class="bld-acc-stat">
              <span style="color:#16a34a;font-weight:700">${free}</span>
              <span style="color:var(--muted)">/${total}</span>
            </span>
            <button class="bld-acc-toggle" type="button" onclick="event.stopPropagation();window.__toggleAcc('${safeKey}')" aria-label="${bName(bKey)} 강의실 펼치기">
              <span class="bld-acc-chevron" id="acc-chev-${safeKey}">▶</span>
            </button>
          </div>
          <div class="bld-accordion-body" id="acc-body-${safeKey}" style="display:none">
            ${rooms.map(roomRow).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;

    // 건물 등록 (key 매핑 저장)
    for(const [bKey] of sorted){
      const safeKey=bKey.replace(/[^a-zA-Z0-9가-힣]/g,'_');
      window[`__bld_${safeKey}`]=bKey;
    }
  }

  function roomRow(r){
    const isFree=r.free;
    const statusText=isFree
      ?'빈 자리'
      :`${r.curName||'수업 중'} · ${r.curStart}~${r.curEnd}`;
    const nextText=r.nextName?`<span class="room-row-next">다음 ${r.nextStart}</span>`:'';
    return`<div class="room-row-compact room-clickable" onclick="window.__showRoomSchedule(${JSON.stringify(r.room)})" title="강의실 주간 일정 보기">
      <span class="room-row-num">${r.room}</span>
      <span class="room-row-status ${isFree?'free':'busy'}">
        <span class="room-row-dot" style="background:${isFree?'#16a34a':'#dc2626'}"></span>
        ${statusText}
      </span>
      ${nextText}
    </div>`;
  }

  function roomCard(r){
    const badge=r.free
      ?`<span class="status-free"><span class="status-dot-green"></span>비어있음</span>`
      :`<span class="status-in-use"><span class="status-dot-red"></span>수업 중</span>`;
    const body=r.free
      ?`<div class="room-empty-label">이 시간 수업 없음</div>`
      :`<div class="room-course-name">${r.curName}</div>
        <div class="room-professor">${r.curProf}</div>
        <div class="room-time">⏱ ${r.curStart} ~ ${r.curEnd}</div>`;
    const next=r.nextName?`<div class="room-next">다음 수업 ${r.nextStart} · ${r.nextName}</div>`:'';
    return`<div class="room-card room-clickable ${r.free?'free':'in-use'}" onclick="window.__showRoomSchedule(${JSON.stringify(r.room)})" title="강의실 주간 일정 보기">
      <div class="room-card-header"><span class="room-name">${r.room}</span>${badge}</div>
      ${body}${next}
    </div>`;
  }

  /* 아코디언 토글 (safeKey → bKey 역매핑 포함) */
  function toggleAccordion(safeKey){
    const body=document.getElementById('acc-body-'+safeKey);
    const chev=document.getElementById('acc-chev-'+safeKey);
    if(!body) return;
    const open=body.style.display!=='none';
    body.style.display=open?'none':'block';
    chev.classList.toggle('open',!open);
  }
  window.__toggleAcc=toggleAccordion;

  function selectBuildingBySafe(safeKey){
    const bKey=window[`__bld_${safeKey}`];
    if(bKey) selectBuilding(bKey);
  }
  window.__selectBldBySafe=selectBuildingBySafe;

  function getCourseSlotsForRoom(room){
    if(!coursesCache || !room) return [];
    const rows=[];
    const pushSlot=(slot, courseName, prof)=>{
      if(slot.room!==room) return;
      rows.push({day:slot.day,start:slot.start,end:slot.end,name:courseName||'과목명 없음',prof:prof||''});
    };
    if(coursesCache[0]?.slots!==undefined){
      for(const c of coursesCache){ for(const s of c.slots||[]) pushSlot(s,c.name,c.professor); }
    }else{
      for(const c of coursesCache){ const cname=c.course_name||c.name||''; for(const s of parseRaw(c.schedule_room||'')) pushSlot(s,cname,c.professor); }
    }
    const seen=new Set();
    return rows.filter(r=>{const key=r.day+'|'+r.start+'|'+r.end+'|'+r.name+'|'+r.prof; if(seen.has(key)) return false; seen.add(key); return true;})
      .sort((a,b)=>a.day!==b.day?a.day-b.day:toMin(a.start)-toMin(b.start));
  }

  function currentSlotClass(s){
    const dow=selectedDate.getDay();
    const dayIdx=(dow===0||dow===6)?-1:dow-1;
    return s.day===dayIdx && toMin(s.start)<=selectedMin && selectedMin<toMin(s.end) ? ' class=\"current-slot\"' : '';
  }

  function renderRoomScheduleRows(slots){
    const days=['월','화','수','목','금'];
    if(!slots.length) return '<tr><td colspan=\"3\" style=\"text-align:center;color:var(--muted);padding:28px\">이 강의실의 정규 수업 일정이 없습니다.</td></tr>';
    return slots.map(s=>'<tr'+currentSlotClass(s)+'><td class=\"room-week-day\">'+(days[s.day]||'?')+'</td><td class=\"room-week-time\">'+s.start+'~'+s.end+'</td><td><div class=\"room-week-course\">'+s.name+'</div>'+(s.prof?'<div class=\"room-week-prof\">'+s.prof+'</div>':'')+'</td></tr>').join('');
  }

  function showRoomSchedule(room){
    const building=extractBuilding(room);
    const geoKey=toGeoKey(building);
    const geo=buildingsGeo[geoKey];
    const slots=getCourseSlotsForRoom(room);
    const backdrop=document.createElement('div');
    backdrop.className='room-detail-backdrop';
    const modal=document.createElement('div');
    modal.className='room-detail-modal';
    const mapHtml=geo?.lat?'<div id=\"roomDetailMap\" class=\"room-detail-map\"></div>':'<div class=\"room-detail-map map-error\"><strong>위치 정보 없음</strong><span>공식 캠퍼스맵에 연결되지 않았습니다.</span></div>';
    const coordHtml=geo?.lat?'공식 좌표: '+geo.lat+', '+geo.lng:'좌표 없음';
    modal.innerHTML='<div class=\"room-detail-head\"><div><div class=\"room-detail-title\">'+room+'</div><div class=\"room-detail-sub\">'+bName(building)+' · 주간 강의실 일정</div></div><button class=\"room-detail-close\" type=\"button\">✕</button></div><div class=\"room-detail-body\"><div class=\"room-detail-grid\"><div><table class=\"room-week-table\"><thead><tr><th>요일</th><th>시간</th><th>수업</th></tr></thead><tbody>'+renderRoomScheduleRows(slots)+'</tbody></table></div><div>'+mapHtml+'<div class=\"room-detail-info\"><strong>'+(geo?.name||bName(building))+'</strong><br>'+coordHtml+'<br>일정 '+slots.length+'개</div></div></div></div>';
    document.body.appendChild(backdrop);
    backdrop.appendChild(modal);
    const close=()=>backdrop.remove();
    backdrop.addEventListener('click',e=>{ if(e.target===backdrop) close(); });
    modal.querySelector('.room-detail-close').addEventListener('click',close);
    if(geo?.lat){
      setTimeout(async()=>{
        const el=document.getElementById('roomDetailMap');
        if(!el) return;
        try{
          await loadKakaoSdk();
          const pos=new kakao.maps.LatLng(geo.lat,geo.lng);
          const map=new kakao.maps.Map(el,{center:pos,level:3});
          const marker=new kakao.maps.Marker({position:pos,map});
          const info=new kakao.maps.InfoWindow({content:'<div style=\"padding:6px 9px;font-size:12px;font-weight:700;white-space:nowrap\">'+(geo.name||room)+'</div>'});
          info.open(map,marker);
          setTimeout(()=>map.relayout(),80);
        }catch(e){ el.innerHTML='<div class=\"map-error\"><strong>지도 로드 실패</strong><span>'+e.message+'</span></div>'; }
      },80);
    }
  }
  window.__showRoomSchedule=showRoomSchedule;

  function updateStats(){
    const list=filtered();
    const inUse=list.filter(r=>!r.free).length;
    document.getElementById('totalRooms').textContent=list.length;
    document.getElementById('inUseRooms').textContent=inUse;
    document.getElementById('freeRooms').textContent=list.length-inUse;
  }

  /* ── 시계 ── */
  function tick(){
    const n=new Date(),days=['일','월','화','수','목','금','토'];
    document.getElementById('clockDisplay').textContent=
      `${days[n.getDay()]}요일 ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  }
  tick(); setInterval(tick,30000);

  /* ── 달력 네비 ── */
  document.getElementById('calPrev').addEventListener('click',()=>{
    calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click',()=>{
    calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar();
  });


  /* ── 건물 초기화 버튼 ── */
  document.getElementById('bldResetBtn').addEventListener('click',resetBuilding);

  /* ── 검색 ── */
  document.getElementById('roomSearch').addEventListener('input',e=>{
    searchQ=e.target.value.trim();
    // 검색 시 건물 필터 유지
    render(); updateStats();
  });

  /* ── 데이터 로드 ── */
  async function loadData(){
    setRoomsMessage('<div class="spinner"></div><span>강의 데이터를 불러오는 중...</span>', 'info');

    try{
      const r=await fetchJsonWithTimeout('/data/buildings.json?source=official-campus-20260603', 8000);
      if(r.ok && r.data){
        buildingsGeo=r.data;
        window.__YEOGI_BUILDINGS=buildingsGeo;
        console.log('[YEOGI] official campus buildings loaded', buildingsGeo['22'], buildingsGeo['52'], buildingsGeo['85']);
      }
    }catch(e){
      console.warn('buildings.json 로드 실패',e);
    }

    const localFallbacks=[
      ['/data/courses_2026_1.json','local cache courses_2026_1'],
      ['/data/courses.json','local cache courses'],
      ['/courses_all.json','legacy courses_all']
    ];

    try{
      const api=await fetchJsonWithTimeout('/api/courses?year=2026&semester='+encodeURIComponent('1학기')+'&_='+Date.now(), 12000);
      if(api.ok && Array.isArray(api.data) && api.data.length>0){
        useCourses(api.data,'api/courses');
        return;
      }
      if(api.status===202 || api.data?.status==='crawling'){
        console.warn('[YEOGI] courses API is crawling, using local cache first');
      }else{
        console.warn('[YEOGI] courses API returned non-array', api.status, api.data);
      }
    }catch(e){
      console.warn('[YEOGI] courses API failed, using local cache', e.message);
    }

    for(const [url,label] of localFallbacks){
      try{
        const local=await fetchJsonWithTimeout(url+'?_='+Date.now(), 10000);
        if(local.ok && Array.isArray(local.data) && local.data.length>0){
          useCourses(local.data,label);
          return;
        }
      }catch(e){
        console.warn('[YEOGI] local course fallback failed', url, e.message);
      }
    }

    setRoomsMessage('⚠ 강의 데이터를 불러올 수 없습니다.<br><small>서버를 재시작하거나 data/courses_2026_1.json 파일을 확인해주세요.</small>', 'error');
    updateStats();
  }

  async function load(){
    await Promise.allSettled([
      loadData(),
      (async()=>{
        try{
          const result=await loadKakaoSdk();
          console.log('[Kakao] SDK 준비 완료:', result);
          initKakaoMap();
        }catch(e){
          console.warn('[Kakao] 초기화 실패:', e.message, '→ OpenStreetMap 폴백');
          initLeafletMap();
        }
      })()
    ]);
  }

  /* ── 초기화 ── */
  renderCalendar();
  buildTimePicker();
  // 슬라이더 초기값 = 현재 선택 시간
  document.getElementById('timeSlider').value = selectedMin;
  document.getElementById('sliderTimeLabel').textContent = minToHHMM(selectedMin);
  updateBadge();
  load();
  </script>
</body>
</html>
