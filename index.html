<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>홈 · 여기(YEOGI)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="index">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand yeogi-brand">
          <span class="brand-ko">여기</span>
          <span class="brand-en">YEOGI</span>
        </div>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" type="button">✕</button>
      </div>
      <nav class="side-nav">
        <a class="side-link active" href="index.html"><span class="nav-icon">🏠</span>홈</a>
        <a class="side-link" href="generate.html"><span class="nav-icon">📅</span>시간표 생성</a>
        <a class="side-link" href="classroom.html"><span class="nav-icon">🏫</span>강의실 현황</a>
        <a class="side-link" href="library.html"><span class="nav-icon">📚</span>도서관 자리</a>
        <a class="side-link" href="settings.html"><span class="nav-icon">⚙️</span>설정</a>
      </nav>
      <div class="side-logout">
        <button class="logout-btn" type="button">로그아웃</button>
      </div>
    </aside>

    <main class="content">
      <header class="page-header">
        <div class="page-header-title">
          <button class="hamburger-btn" id="hamburgerBtn" type="button">☰</button>
          <div>
          <h1>나의 시간표</h1>
          </div>
        </div>
        <div class="home-top-actions" aria-label="빠른 이동">
          <a class="home-icon-btn" href="generate.html" title="시간표 생성">
            <span class="home-icon-mark">▦</span>
            <span class="home-icon-label">시간표</span>
          </a>
          <a class="home-icon-btn" href="classroom.html" title="강의실 현황">
            <span class="home-icon-mark">⌖</span>
            <span class="home-icon-label">강의실</span>
          </a>
          <a class="home-icon-btn" href="library.html" title="도서관 자리">
            <span class="home-icon-mark">▣</span>
            <span class="home-icon-label">도서관</span>
          </a>
          <a class="home-icon-btn" href="settings.html" title="설정">
            <span class="home-icon-mark">⚙</span>
            <span class="home-icon-label">설정</span>
          </a>
        </div>
        <div class="header-actions">
          <div class="field compact">
            <label for="yearSelect">학년도</label>
            <select id="yearSelect"></select>
          </div>
          <div class="field compact">
            <label for="semesterSelect">학기</label>
            <select id="semesterSelect">
              <option value="1학기">1학기</option>
              <option value="2학기">2학기</option>
              <option value="여름학기">여름학기</option>
              <option value="겨울학기">겨울학기</option>
            </select>
          </div>
        </div>
      </header>

      <section class="board-grid">
        <article class="card timetable-card">
          <div class="card-head">
            <div>
              <span class="small-note" id="timetableTerm">2026년 1학기</span>
              <h2 id="timetableTitle">시간표 1</h2>
            </div>
            <div class="timetable-stats">
              <span><strong id="appliedCredits">15</strong>학점</span>
              <span>총 <strong id="totalCredits">82</strong>학점</span>
            </div>
          </div>
          <div id="timetableContainer" class="timetable-container"></div>
        </article>

        <aside class="side-stack">
          <article class="card friend-card">
            <div class="card-head">
              <h2>친구 시간표</h2>
            </div>
            <div class="friend-add-row">
              <input id="friendStudentId" type="text" maxlength="8" inputmode="numeric" placeholder="학번 검색" />
              <button id="addFriendBtn" class="secondary-btn" type="button">추가</button>
            </div>
            <p id="friendMessage" class="small-note"></p>
            <div id="friendsList" class="friend-list"></div>
          </article>
        </aside>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
