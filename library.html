<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도서관 자리 · 여기(YEOGI)</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .clicker_s_o {
      background: url(https://cwlibclicker.changwon.ac.kr/clicker/images/seat_object_back.png) repeat;
      border-radius: 5px;
      display: block;
      padding: 0;
      color: white;
      font-size: 10pt;
      font-weight: 700;
      box-sizing: content-box;
      text-align: center;
      line-height: 30px;
    }
    .clicker_seat_size_normal { height: 30px; width: 30px; }
    .clicker_s_b_n { border: 2px solid #5d9625; }
    .clicker_s_b_o { border: 2px solid #942894; }
    .clicker_s_b_c { border: 2px solid #942894; }
    .clicker_s_b_pa { border: 2px solid #0033cc; }
    .clicker_se_st_no span { background: #85d604; background: linear-gradient(#85d604 40%, #77c004); display: block; line-height: 30px; width: 100%; }
    .clicker_se_st_in span { background: #92148d; background: linear-gradient(#f18fee 40%, #92148d); border-radius: 2px; display: block; line-height: 30px; width: 100%; }
    .clicker_se_st_booking span { background: #f59e0b; background: linear-gradient(#fde68a 40%, #f59e0b); color: #4a2d00; display: block; line-height: 30px; width: 100%; }
    .clicker_seat_status_closed span { background: #e51337; background: linear-gradient(#f79aaa 40%, #e51337); display: block; line-height: 30px; width: 100%; }
    .clicker_s_s_no { display: block; }

    .library-card { padding: 18px 22px; }
    .map-fit-frame {
      width: 100%;
      height: clamp(360px, calc(100vh - 330px), 640px);
      min-height: 360px;
      overflow: hidden;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: #f8f9fa;
      display: grid;
      place-items: center;
    }
    .map-scale-stage { position: relative; flex: 0 0 auto; }
    .map-inner { position: relative; background-repeat: no-repeat; background-position: top left; transform-origin: top left; }
    .map-inner .clicker_s_o { position: absolute; cursor: default; }
    .map-inner .clicker_s_o:hover { opacity: .9; transform: scale(1.18); z-index: 10; }
    .map-fit-note { margin-top: 8px; color: var(--muted); font-size: 11px; text-align: right; }

    .view-toggle { display: flex; gap: 6px; margin-bottom: 14px; }
    .view-btn, .refresh-btn, .filter-chip {
      border: 1.5px solid var(--line);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      transition: all .15s;
    }
    .view-btn { padding: 6px 16px; border-radius: 10px; font-size: 13px; }
    .view-btn.active { background: #1a3a7a; border-color: #1a3a7a; color: #fff; }
    .refresh-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .refresh-btn { padding: 6px 14px; border-radius: 10px; font-size: 12px; }
    .refresh-btn:hover { border-color: #2563eb; color: #2563eb; }
    .refresh-btn:disabled { opacity: .5; cursor: default; }
    .last-updated { font-size: 12px; color: var(--muted); }
    .link-to-clicker { font-size: 13px; color: #2563eb; text-decoration: none; font-weight: 700; }
    .link-to-clicker:hover { text-decoration: underline; }

    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .filter-chip { padding: 5px 12px; border-radius: 20px; font-size: 12px; }
    .filter-chip.active { background: #2563eb; border-color: #2563eb; color: #fff; }

    .seat-grid-real { display: flex; flex-wrap: wrap; gap: 5px; padding: 16px 0; }
    .seat-real {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1.5px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .seat-real.available { background: #dcfce7; border-color: #86efac; color: #15803d; }
    .seat-real.occupied { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }
    .seat-real.reserved { background: #fef3c7; border-color: #f59e0b; color: #92400e; }
    .seat-real.pending { background: #dbeafe; border-color: #60a5fa; color: #1d4ed8; }
    .seat-real.closed, .seat-real.unavailable { background: #f1f5f9; border-color: #cbd5e1; color: #64748b; }
    .seat-type-badge { font-size: 7px; opacity: .78; margin-top: 1px; white-space: nowrap; }

    .map-legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 12px 0 4px; font-size: 12px; align-items: center; }
    .legend-dot-clicker { width: 16px; height: 16px; border-radius: 3px; border: 2px solid; display: inline-block; vertical-align: middle; }
    .map-inner .seat-cat-normal span, .seat-real.seat-cat-normal { background: #86bfff; color: #08315f; }
    .map-inner .seat-cat-partition span, .seat-real.seat-cat-partition { background: #63c900; color: #173b00; }
    .map-inner .seat-cat-notebook span, .seat-real.seat-cat-notebook { background: #ff6076; color: #fff; }
    .map-inner .seat-cat-handicapped span, .seat-real.seat-cat-handicapped { background: #e5e7eb; color: #374151; }
    .map-inner .seat-cat-unavailable span, .seat-real.seat-cat-unavailable { background: #ffb09a; color: #7c1d12; }
    .map-inner .seat-cat-occupied span, .seat-real.seat-cat-occupied { background: #b632bd; color: #fff; }
    .map-inner .seat-cat-reserved span, .seat-real.seat-cat-reserved { background: #c647d5; color: #fff; }
    .map-inner .seat-cat-pending span, .seat-real.seat-cat-pending { background: #bf3ad4; color: #fff; }
    .map-inner .seat-cat-smartPhone span, .seat-real.seat-cat-smartPhone { background: #bf45cf; color: #fff; }
    .map-inner .seat-cat-normal { border-color: #1677ff !important; }
    .map-inner .seat-cat-partition { border-color: #3f9700 !important; }
    .map-inner .seat-cat-notebook { border-color: #e11d48 !important; }
    .map-inner .seat-cat-handicapped { border-color: #a000c8 !important; }
    .map-inner .seat-cat-unavailable { border-color: #ff4c38 !important; }
    .map-inner .seat-cat-occupied { border-color: #8f1d99 !important; }
    .map-inner .seat-cat-reserved { border-color: #9f25b5 !important; }
    .map-inner .seat-cat-pending { border-color: #7e22ce !important; }
    .map-inner .seat-cat-smartPhone { border-color: #9f25b5 !important; }
    .seat-real.seat-cat-normal { border-color: #1677ff; }
    .seat-real.seat-cat-partition { border-color: #3f9700; }
    .seat-real.seat-cat-notebook { border-color: #e11d48; }
    .seat-real.seat-cat-handicapped { border-color: #a000c8; }
    .seat-real.seat-cat-unavailable { border-color: #ff4c38; }
    .seat-real.seat-cat-occupied { border-color: #8f1d99; }
    .seat-real.seat-cat-reserved { border-color: #9f25b5; }
    .seat-real.seat-cat-pending { border-color: #7e22ce; }
    .seat-real.seat-cat-smartPhone { border-color: #9f25b5; }
    .legend-dot-clicker.seat-cat-normal { background:#86bfff;border-color:#1677ff; }
    .legend-dot-clicker.seat-cat-partition { background:#63c900;border-color:#3f9700; }
    .legend-dot-clicker.seat-cat-notebook { background:#ff6076;border-color:#e11d48; }
    .legend-dot-clicker.seat-cat-handicapped { background:#e5e7eb;border-color:#a000c8; }
    .legend-dot-clicker.seat-cat-unavailable { background:#ffb09a;border-color:#ff4c38; }
    .legend-dot-clicker.seat-cat-occupied { background:#b632bd;border-color:#8f1d99; }
    .legend-dot-clicker.seat-cat-reserved { background:#c647d5;border-color:#9f25b5; }
    .legend-dot-clicker.seat-cat-pending { background:#bf3ad4;border-color:#7e22ce; }
    .legend-dot-clicker.seat-cat-smartPhone { background:#bf45cf;border-color:#9f25b5; }
    @media (max-width: 760px) {
      .library-card { padding: 14px; }
      .map-fit-frame { height: clamp(280px, 52vh, 460px); min-height: 280px; }
      .view-toggle { width: 100%; }
      .view-btn { flex: 1; }
    }
  </style>
</head>
<body data-page="library">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand yeogi-brand">
          <span class="brand-ko">여기</span>
          <span class="brand-en">YEOGI</span>
        </div>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" type="button">닫기</button>
      </div>
      <nav class="side-nav">
        <a class="side-link" href="index.html"><span class="nav-icon">홈</span>홈</a>
        <a class="side-link" href="generate.html"><span class="nav-icon">표</span>시간표 생성</a>
        <a class="side-link" href="classroom.html"><span class="nav-icon">강</span>강의실 현황</a>
        <a class="side-link active" href="library.html"><span class="nav-icon">도</span>도서관 자리</a>
        <a class="side-link" href="settings.html"><span class="nav-icon">설</span>설정</a>
      </nav>
      <div class="side-logout">
        <button class="logout-btn" type="button">로그아웃</button>
      </div>
    </aside>

    <main class="content">
      <header class="page-header">
        <div class="page-header-title">
          <button class="hamburger-btn" id="hamburgerBtn" type="button">메뉴</button>
          <div>
            <h1>도서관 자리</h1>
            <p class="subtext">창원대학교 중앙도서관 열람실 실시간 좌석 현황</p>
          </div>
        </div>
        <div class="header-actions">
          <div class="live-clock">
            <span class="live-dot"></span>
            <span id="clockDisplay">--:--</span>
          </div>
        </div>
      </header>

      <div class="library-stats">
        <div class="lib-stat-card green">
          <span class="lib-stat-num" id="statFree">-</span>
          <span class="lib-stat-label">빈 자리</span>
        </div>
        <div class="lib-stat-card red">
          <span class="lib-stat-num" id="statOccupied">-</span>
          <span class="lib-stat-label">사용 중</span>
        </div>
        <div class="lib-stat-card">
          <span class="lib-stat-num" id="statTotal">-</span>
          <span class="lib-stat-label">전체 좌석</span>
        </div>
      </div>

      <div class="floor-tabs">
        <button class="floor-tab active" data-room="3" type="button">제3열람실</button>
        <button class="floor-tab" data-room="4" type="button">제4열람실</button>
      </div>

      <div class="refresh-row">
        <button class="refresh-btn" id="refreshBtn" type="button">새로고침</button>
        <span class="last-updated" id="lastUpdated">로딩 중...</span>
        <a class="link-to-clicker" id="clickerLink" href="https://cwlibclicker.changwon.ac.kr/Clicker/UserSeat/20220328153700698?DeviceName=normal3열람실" target="_blank" rel="noopener">클리커 바로가기</a>
      </div>

      <div class="card library-card">
        <div class="card-head" style="margin-bottom:14px">
          <div>
            <h2 id="roomTitle">제3열람실</h2>
            <span class="small-note" id="seatCountNote"></span>
          </div>
          <div class="view-toggle">
            <button class="view-btn active" id="btnMapView" type="button">좌석 지도</button>
            <button class="view-btn" id="btnListView" type="button">목록</button>
          </div>
        </div>

        <div class="filter-row" id="filterRow">
          <button class="filter-chip active" data-filter="all" type="button">전체</button>
          <button class="filter-chip" data-filter="status:available" type="button">빈 자리만</button>
        </div>

        <div id="seatContainer">
          <div class="loading-state">
            <div class="spinner"></div>
            <span>좌석 정보 불러오는 중...</span>
          </div>
        </div>

        <div class="map-legend" id="legend" style="display:none">
          <span class="legend-item"><span class="legend-dot-clicker seat-cat-normal"></span>&nbsp;일반좌석</span>
          <span class="legend-item"><span class="legend-dot-clicker seat-cat-partition"></span>&nbsp;칸막이 좌석</span>
          <span class="legend-item"><span class="legend-dot-clicker seat-cat-notebook"></span>&nbsp;노트북 좌석</span>
          <span class="legend-item"><span class="legend-dot-clicker seat-cat-handicapped"></span>&nbsp;장애인 좌석</span>
          <span class="legend-item"><span class="legend-dot-clicker seat-cat-unavailable"></span>&nbsp;사용불가</span>
          <span class="legend-item"><span class="legend-dot-clicker seat-cat-occupied"></span>&nbsp;사용 중</span>
          <span class="legend-item"><span class="legend-dot-clicker seat-cat-reserved"></span>&nbsp;예약 중</span>
          <span class="legend-item"><span class="legend-dot-clicker seat-cat-pending"></span>&nbsp;게이트 인증 대기</span>
          <span class="legend-item"><span class="legend-dot-clicker seat-cat-smartPhone"></span>&nbsp;Smart Phone (+)</span>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
  const ROOMS = {
    '3': {
      id: '20220328153700698',
      name: '제3열람실',
      link: 'https://cwlibclicker.changwon.ac.kr/Clicker/UserSeat/20220328153700698?DeviceName=normal3열람실',
      bg: 'https://cwlibclicker.changwon.ac.kr/clicker/users/cnul/layout_reading_room_floor3F.png',
      w: 1385,
      h: 778,
    },
    '4': {
      id: '20120821110254851',
      name: '제4열람실',
      link: 'https://cwlibclicker.changwon.ac.kr/Clicker/UserSeat/20120821110254851?DeviceName=normal4열람실',
      bg: 'https://cwlibclicker.changwon.ac.kr/clicker/users/cnul/layout_reading_room_floor4F.png',
      w: 1396,
      h: 822,
    },
  };

  let curRoom = '3';
  let curFilter = 'all';
  let curView = 'map';
  let allSeats = [];
  let autoTimer = null;
  let lastMapInfo = null;

  const STATUS_LABELS = {
    available: '빈 자리',
    occupied: '사용 중',
    reserved: '예약 중',
    pending: '게이트 인증 대기',
    closed: '사용불가',
    unavailable: '사용불가',
  };
  const TYPE_LABELS = {
    normal: '일반좌석',
    notebook: '노트북 좌석',
    partition: '칸막이 좌석',
    handicapped: '장애인 좌석',
    smartPhone: 'Smart Phone (+)',
    noKiosk: 'Smart Phone (+)',
    unknown: '기타 좌석',
  };
  const CATEGORY_LABELS = {
    normal: '일반좌석',
    partition: '칸막이 좌석',
    notebook: '노트북 좌석',
    handicapped: '장애인 좌석',
    unavailable: '사용불가',
    occupied: '사용 중',
    reserved: '예약 중',
    pending: '게이트 인증 대기',
    smartPhone: 'Smart Phone (+)',
  };
  const TYPE_ICONS = { notebook: '노트북', partition: '칸막이', handicapped: '장애인', smartPhone: 'SP+', noKiosk: 'SP+', normal: '일반' };

  function escapeHtml(v) {
    return String(v ?? '').replace(/[&<>'"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch]));
  }
  function getSeatTypeLabel(type) { return TYPE_LABELS[type] || TYPE_LABELS.unknown; }
  function getSeatStatusLabel(status) { return STATUS_LABELS[status] || STATUS_LABELS.unavailable; }
  function getSeatCategory(s) { return s.category || (s.status === 'unavailable' || s.status === 'closed' ? 'unavailable' : s.status === 'occupied' ? 'occupied' : s.status === 'reserved' ? 'reserved' : s.status === 'pending' ? 'pending' : s.type === 'smartPhone' || s.type === 'noKiosk' ? 'smartPhone' : s.type || 'normal'); }
  function getSeatCategoryLabel(category) { return CATEGORY_LABELS[category] || getSeatTypeLabel(category); }

  function tick() {
    const now = new Date();
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    document.getElementById('clockDisplay').textContent = `${days[now.getDay()]}요일 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  }
  tick();
  setInterval(tick, 30000);

  async function loadSeats() {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.textContent = '로딩 중...';
    document.getElementById('lastUpdated').textContent = '불러오는 중...';
    try {
      const res = await fetch(`/api/library?room=${curRoom}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      allSeats = data.seats || [];
      document.getElementById('statFree').textContent = data.available ?? '-';
      document.getElementById('statOccupied').textContent = data.occupied ?? '-';
      document.getElementById('statTotal').textContent = data.total ?? '-';
      const n = new Date();
      document.getElementById('lastUpdated').textContent = `${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')} 기준 · 20초 자동갱신`;
      render();
      document.getElementById('legend').style.display = 'flex';
    } catch (e) {
      console.error('[YEOGI library] load/render failed', e);
      document.getElementById('seatContainer').innerHTML = `
        <div class="loading-state" style="color:#dc2626">
          <p>좌석 정보를 불러올 수 없습니다</p>
          <small>${escapeHtml(e.message || e)}</small>
          <a href="${ROOMS[curRoom].link}" target="_blank" class="link-to-clicker" style="margin-top:8px">클리커 직접 방문</a>
        </div>`;
      ['statFree', 'statOccupied', 'statTotal'].forEach(id => { document.getElementById(id).textContent = '-'; });
      document.getElementById('lastUpdated').textContent = '오류 발생';
    } finally {
      btn.disabled = false;
      btn.textContent = '새로고침';
    }
  }

  function render() {
    const info = ROOMS[curRoom];
    document.getElementById('roomTitle').textContent = info.name;
    document.getElementById('clickerLink').href = info.link;
    document.getElementById('filterRow').style.display = curView === 'map' ? 'none' : 'flex';
    if (curView === 'map') renderMap(info);
    else renderList();
  }

  function calcMapScale(info) {
    const container = document.getElementById('seatContainer');
    const card = container.closest('.card');
    const width = Math.max(280, (card?.clientWidth || container.clientWidth || window.innerWidth) - 48);
    const height = Math.max(260, Math.min(window.innerHeight - 330, 640));
    return Math.max(0.2, Math.min(width / info.w, height / info.h, 1));
  }

  function renderMap(info) {
    lastMapInfo = info;
    document.getElementById('seatCountNote').textContent = `전체 ${allSeats.length}석`;
    const scale = calcMapScale(info);
    const divs = allSeats.map(s => {
      const typeClass = s.type === 'notebook' ? 'clicker_seat_status_notebook'
        : s.type === 'handicapped' ? 'clicker_seat_status_handicaped'
        : s.type === 'noKiosk' ? 'clicker_seat_status_no_kiosk'
        : '';
      const borderCls = s.type === 'partition' ? 'clicker_s_b_pa'
        : (s.status === 'occupied' || s.status === 'closed' || s.status === 'unavailable') ? 'clicker_s_b_o'
        : 'clicker_s_b_n';
      const stateCls = s.status === 'available' ? 'clicker_se_st_no'
        : s.status === 'occupied' ? 'clicker_se_st_in clicker_se_st_full_in'
        : (s.status === 'reserved' || s.status === 'pending') ? 'clicker_se_st_booking'
        : '';
      const closedCls = (s.status === 'closed' || s.status === 'unavailable') ? 'clicker_seat_status_closed' : '';
      const category = getSeatCategory(s);
      const title = `${s.num}번 · ${getSeatCategoryLabel(category)} · ${getSeatStatusLabel(s.status)}`;
      const badge = TYPE_ICONS[s.type] && s.type !== 'normal' ? `<small style="font-size:7px;display:block;line-height:8px">${TYPE_ICONS[s.type]}</small>` : '';
      return `<div class="clicker_s_o clicker_seat_size_normal seat-cat-${category} ${typeClass} ${borderCls} ${stateCls} ${closedCls}"
                   style="top:${s.top}px;left:${s.left}px;position:absolute;"
                   title="${escapeHtml(title)}">
                <span class="clicker_s_s_no" style="width:100%">${s.num}</span>${badge}
              </div>`;
    }).join('');

    document.getElementById('seatContainer').innerHTML = `
      <div class="map-fit-frame" id="mapFitFrame">
        <div class="map-scale-stage" style="width:${Math.round(info.w * scale)}px;height:${Math.round(info.h * scale)}px">
          <div class="map-inner" style="width:${info.w}px;height:${info.h}px;background-image:url(${info.bg});transform:scale(${scale})">
            ${divs}
          </div>
        </div>
      </div>
      <div class="map-fit-note">현재 화면에 맞춤 배율 ${Math.round(scale * 100)}%</div>`;
  }

  function renderFilterChips() {
    const row = document.getElementById('filterRow');
    const categoryOrder = ['normal','partition','notebook','handicapped','unavailable','occupied','reserved','pending','smartPhone'];
    const present = new Set(allSeats.map(getSeatCategory));
    const chips = [
      ['all', '전체'],
      ['status:available', '빈 자리만'],
      ...categoryOrder
        .filter(c => present.has(c) || ['occupied','reserved','pending','smartPhone'].includes(c))
        .map(c => [`category:${c}`, getSeatCategoryLabel(c)])
    ];
    row.innerHTML = chips.map(([filter, label]) => `<button class="filter-chip ${filter === curFilter ? 'active' : ''}" data-filter="${filter}" type="button">${escapeHtml(label)}</button>`).join('');
  }

  function renderList() {
    renderFilterChips();
    let list = allSeats;
    if (curFilter.startsWith('status:')) {
      list = list.filter(s => s.status === curFilter.split(':')[1]);
    } else if (curFilter.startsWith('category:')) {
      list = list.filter(s => getSeatCategory(s) === curFilter.split(':')[1]);
    } else if (curFilter.startsWith('type:')) {
      list = list.filter(s => s.type === curFilter.split(':')[1]);
    }
    document.getElementById('seatCountNote').textContent = `${list.length}석 표시 (전체 ${allSeats.length}석)`;
    if (!list.length) {
      document.getElementById('seatContainer').innerHTML = '<div class="loading-state">표시할 좌석이 없습니다.</div>';
      return;
    }
    document.getElementById('seatContainer').innerHTML = `<div class="seat-grid-real">` + list.map(s => `
      <div class="seat-real seat-cat-${escapeHtml(getSeatCategory(s))}" title="${escapeHtml(`${s.num}번 · ${getSeatCategoryLabel(getSeatCategory(s))} · ${getSeatStatusLabel(s.status)}`)}">
        <span>${s.num}</span>
        <span class="seat-type-badge">${escapeHtml(getSeatCategoryLabel(getSeatCategory(s)))}</span>
      </div>`).join('') + `</div>`;
  }

  document.getElementById('btnMapView').addEventListener('click', () => {
    curView = 'map';
    document.getElementById('btnMapView').classList.add('active');
    document.getElementById('btnListView').classList.remove('active');
    render();
  });
  document.getElementById('btnListView').addEventListener('click', () => {
    curView = 'list';
    document.getElementById('btnListView').classList.add('active');
    document.getElementById('btnMapView').classList.remove('active');
    render();
  });
  document.querySelectorAll('.floor-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.floor-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      curRoom = btn.dataset.room;
      curFilter = 'all';
      startAutoRefresh();
    });
  });
  document.getElementById('filterRow').addEventListener('click', event => {
    const btn = event.target.closest('.filter-chip');
    if (!btn) return;
    curFilter = btn.dataset.filter || 'all';
    renderList();
  });
  document.getElementById('refreshBtn').addEventListener('click', loadSeats);
  window.addEventListener('resize', () => {
    if (curView === 'map' && lastMapInfo) renderMap(lastMapInfo);
  });

  function startAutoRefresh() {
    if (autoTimer) clearInterval(autoTimer);
    loadSeats();
    autoTimer = setInterval(loadSeats, 20000);
  }
  startAutoRefresh();
  </script>
</body>
</html>
